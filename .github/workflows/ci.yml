name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  go:
    name: Go Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-mode: goinstall

      - name: Run vet
        run: go vet ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Run unit tests (fast)
        run: go test ./...

      - name: Run race detector with coverage
        run: go test -race -coverprofile=coverage.out ./...

      - name: Verify coverage floor
        run: |
          cov=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: $cov%"
          awk -v cov="$cov" 'BEGIN { if (cov + 0 < 50.0) { print "Error: Coverage is below 50.0%"; exit 1 } }'

  web:
    name: Web Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.5.2

      - name: Install dependencies
        run: pnpm --dir web install --frozen-lockfile --ignore-scripts

      - name: Audit frontend dependencies
        run: pnpm --dir web audit --audit-level high

      - name: Lint web app
        run: pnpm --dir web lint
        env:
          ESLINT_USE_FLAT_CONFIG: "true"

      - name: Build web app
        run: pnpm --dir web build

  helm:
    name: Helm Chart Lint & Template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Helm
        uses: azure/setup-helm@v5
        with:
          version: v3.17.3

      - name: Lint Helm Chart
        run: helm lint deploy/helm/draforge

      - name: Helm template smoke test
        run: helm template draforge deploy/helm/draforge

      - name: Package Helm Chart
        run: |
          mkdir -p charts
          helm package deploy/helm/draforge --destination charts
          ls charts/draforge-*.tgz

  goreleaser:
    name: GoReleaser Dry-Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.16.0
          install-only: true

      - name: Dry-run snapshot
        run: goreleaser release --snapshot --clean --skip=docker,sbom,sign

      - name: Verify snapshot artifacts
        run: bash scripts/verify-release.sh

  infra:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.7.0

      - name: Terraform Init
        run: terraform -chdir=infra/terraform/environments/showcase init -backend=false

      - name: Terraform Format Check
        run: terraform -chdir=infra/terraform/environments/showcase fmt -check

      - name: Terraform Validate
        run: terraform -chdir=infra/terraform/environments/showcase validate

      - name: Terraform Plan Policy Validation
        run: scripts/test-validate-plan-fixtures.sh

  ci-pass:
    name: CI Pass
    needs: [go, web, helm, goreleaser, infra]
    runs-on: ubuntu-latest
    steps:
      - name: Complete
        run: echo "All CI checks passed successfully!"