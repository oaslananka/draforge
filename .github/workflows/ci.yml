name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  go:
    name: Go Lint & Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Verify release metadata contract
        run: python3 scripts/verify-release-metadata.py --self-test --root .

      - name: Verify documentation contract
        run: python3 scripts/verify-documentation.py --self-test

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2
          install-mode: goinstall

      - name: Run vet
        run: go vet ./...

      - name: Run govulncheck
        run: go tool govulncheck ./...

      - name: Run unit tests (fast)
        run: go test ./...

      - name: Compile tagged E2E package
        run: go test -tags=e2e ./tests/e2e/... -run '^$'

      - name: Lint E2E shell scripts
        run: |
          shellcheck \
            scripts/prepare-remote-e2e-kubeconfig.sh \
            scripts/remote-e2e.sh \
            scripts/run-remote-e2e-tests.sh \
            scripts/test-prepare-remote-e2e-kubeconfig.sh \
            scripts/test-remote-e2e-harness.sh \
            scripts/e2e-matrix.sh \
            scripts/install-e2e-cni.sh \
            scripts/build-install-e2e-images.sh \
            scripts/run-install-e2e.sh \
            scripts/collect-install-e2e-artifacts.sh \
            scripts/kind-install-e2e.sh \
            scripts/kind-install-e2e-matrix.sh \
            scripts/test-install-e2e-cni.sh \
            scripts/test-install-e2e-harness.sh \
            scripts/verify-install-e2e-policy.sh \
            scripts/verify-release-tag.sh \
            scripts/test-verify-release-tag.sh

      - name: Test release tag provenance
        run: bash scripts/test-verify-release-tag.sh

      - name: Test remote E2E kubeconfig preparation
        run: bash scripts/test-prepare-remote-e2e-kubeconfig.sh

      - name: Test remote E2E orchestration
        run: bash scripts/test-remote-e2e-harness.sh

      - name: Verify install-level E2E policy
        run: scripts/verify-install-e2e-policy.sh

      - name: Test install-level E2E CNI installer
        run: bash scripts/test-install-e2e-cni.sh

      - name: Test install-level E2E orchestration
        run: bash scripts/test-install-e2e-harness.sh

      - name: Run race detector with coverage
        run: go test -race -coverprofile=coverage.out ./...

      - name: Verify coverage floor
        run: |
          cov=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: $cov%"
          awk -v cov="$cov" 'BEGIN { if (cov + 0 < 50.0) { print "Error: Coverage is below 50.0%"; exit 1 } }'

      - name: Upload Go coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          use_oidc: true
          files: ./coverage.out
          flags: go
          disable_search: true
          fail_ci_if_error: true
          name: go

  web:
    name: Web Test, Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.5.2

      - name: Install dependencies
        run: pnpm --dir web install --frozen-lockfile --ignore-scripts

      - name: Audit frontend dependencies
        run: pnpm --dir web audit --audit-level high

      - name: Test web app
        run: pnpm --dir web test

      - name: Lint web app
        run: pnpm --dir web lint
        env:
          ESLINT_USE_FLAT_CONFIG: "true"

      - name: Build web app
        run: pnpm --dir web build

  helm:
    name: Helm Chart Lint & Template
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.3

      - name: Lint Helm Chart
        run: helm lint deploy/helm/draforge

      - name: Helm template smoke test
        run: helm template draforge deploy/helm/draforge

      - name: Helm template install E2E profile
        run: |
          helm template draforge deploy/helm/draforge \
            --namespace draforge-system \
            --values tests/install-e2e/values.yaml \
            > /tmp/draforge-install-e2e.yaml
          grep -Fq 'name: draforge-server-policy' /tmp/draforge-install-e2e.yaml
          grep -Fq 'name: draforge-controller-policy' /tmp/draforge-install-e2e.yaml
          grep -Fq 'docker.io/draforge-e2e/server:local' /tmp/draforge-install-e2e.yaml
          grep -Fq 'docker.io/draforge-e2e/controller:local' /tmp/draforge-install-e2e.yaml
          grep -Fq 'docker.io/draforge-e2e/sim-driver:local' /tmp/draforge-install-e2e.yaml

      - name: Lint chart and deployment contract scripts
        run: shellcheck scripts/verify-chart-images.sh scripts/test-chart-image-verifier.sh scripts/verify-controller-metrics-policy.sh scripts/verify-runtime-lifecycle.sh scripts/verify-dashboard-exposure.sh scripts/verify-sim-driver-cdi.sh scripts/verify-github-action-pins.sh scripts/verify-workload-security.sh scripts/verify-frontend-dependency-policy.sh scripts/remote-build.sh scripts/test-remote-build.sh

      - name: Verify GitHub Action SHA pins
        run: scripts/verify-github-action-pins.sh

      - name: Verify workload security contracts
        run: scripts/verify-workload-security.sh

      - name: Verify frontend dependency policy
        run: scripts/verify-frontend-dependency-policy.sh

      - name: Verify chart image contract
        run: scripts/verify-chart-images.sh

      - name: Test multi-arch image verifier
        run: scripts/test-chart-image-verifier.sh

      - name: Test DOCR showcase integration
        run: scripts/test-remote-build.sh

      - name: Verify controlled controller metrics scraping
        run: scripts/verify-controller-metrics-policy.sh

      - name: Verify runtime readiness and shutdown settings
        run: scripts/verify-runtime-lifecycle.sh

      - name: Verify secure dashboard exposure profiles
        run: scripts/verify-dashboard-exposure.sh

      - name: Verify fail-closed sim-driver CDI modes
        run: scripts/verify-sim-driver-cdi.sh

      - name: Package Helm Chart
        run: |
          mkdir -p charts
          helm package deploy/helm/draforge --destination charts
          ls charts/draforge-*.tgz

  goreleaser:
    name: GoReleaser Dry-Run
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.5.2

      - name: Build web distribution
        run: |
          pnpm --dir web install --frozen-lockfile --ignore-scripts
          pnpm --dir web build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.16.0
          install-only: true

      - name: Verify GoReleaser Docker v2 contract
        run: python3 scripts/verify-goreleaser-docker-v2.py --self-test --check

      - name: Dry-run snapshot including Docker v2 images
        run: goreleaser release --snapshot --clean --skip=sbom,sign

      - name: Verify snapshot artifacts
        env:
          REQUIRE_DOCKER_ARTIFACTS: "1"
        run: bash scripts/verify-release.sh

  infra:
    name: Terraform Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.7.0

      - name: Verify Terraform input contract
        run: python3 scripts/validate-terraform-variables.py --self-test infra/terraform/environments/showcase

      - name: Terraform Init
        run: terraform -chdir=infra/terraform/environments/showcase init -backend=false

      - name: Terraform Format Check
        run: terraform -chdir=infra/terraform/environments/showcase fmt -check

      - name: Terraform Validate
        run: terraform -chdir=infra/terraform/environments/showcase validate

      - name: Terraform Plan Policy Validation
        run: scripts/test-validate-plan-fixtures.sh

  ci-pass:
    name: CI Pass
    needs: [go, web, helm, goreleaser, infra]
    runs-on: ubuntu-latest
    steps:
      - name: Complete
        run: echo "All CI checks passed successfully!"