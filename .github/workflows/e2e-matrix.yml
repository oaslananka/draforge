name: Install E2E Matrix

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      profile:
        description: Kubernetes matrix profile
        required: true
        type: choice
        default: full
        options:
          - pull-request
          - full
  workflow_call:
    inputs:
      profile:
        description: Kubernetes matrix profile
        required: false
        type: string
        default: full
      ref:
        description: Git ref to test
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: install-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  matrix:
    name: Resolve Kubernetes matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      profile: ${{ steps.resolve.outputs.profile }}
      target_sha: ${{ steps.target.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Resolve target commit
        id: target
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve matrix profile from compatibility policy
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_PROFILE: ${{ inputs.profile }}
        run: |
          set -euo pipefail
          if [[ -n "$REQUESTED_PROFILE" ]]; then
            profile=$REQUESTED_PROFILE
          else
            case "$EVENT_NAME" in
              pull_request)
                profile=pull-request
                ;;
              schedule)
                profile=full
                ;;
              *)
                echo "ERROR: install E2E profile is required for event: $EVENT_NAME" >&2
                exit 1
                ;;
            esac
          fi
          matrix=$(scripts/e2e-matrix.sh "$profile")
          echo "profile=$profile" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  install-e2e:
    name: Kubernetes ${{ matrix.kubernetes }} install E2E
    needs: matrix
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    env:
      DRAFORGE_INSTALL_E2E_ARTIFACT_DIR: artifacts/install-e2e
      DRAFORGE_INSTALL_E2E_COMMIT: ${{ needs.matrix.outputs.target_sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.3

      - name: Create kind cluster config
        run: |
          cat > kind-config.yaml <<'CONFIG'
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          featureGates:
            DynamicResourceAllocation: true
          networking:
            disableDefaultCNI: true
            podSubnet: 192.168.0.0/16
          CONFIG

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: ${{ matrix.kind_version }}
          node_image: ${{ matrix.node_image }}
          config: kind-config.yaml
          cluster_name: draforge-install-e2e
          wait: 0s

      - name: Install NetworkPolicy-capable CNI
        run: scripts/install-e2e-cni.sh

      - name: Verify Kubernetes compatibility target
        run: |
          set -euo pipefail
          kubectl version
          kubectl api-resources --api-group=resource.k8s.io

      - name: Build local DRAForge images
        run: scripts/build-install-e2e-images.sh

      - name: Load images into kind
        run: |
          set -euo pipefail
          for image in server controller sim-driver; do
            kind load docker-image "docker.io/draforge-e2e/${image}:local" --name draforge-install-e2e
          done

      - name: Install and verify complete DRAForge stack
        run: scripts/run-install-e2e.sh

      - name: Collect install E2E diagnostics
        if: always()
        run: scripts/collect-install-e2e-artifacts.sh

      - name: Upload failed install E2E artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: install-e2e-${{ matrix.kubernetes }}-${{ github.run_id }}
          path: artifacts/install-e2e/
          if-no-files-found: error
          retention-days: 7
