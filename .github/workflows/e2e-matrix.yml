name: E2E Matrix Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'

jobs:
  local-e2e:
    name: Local E2E Matrix (kind)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        k8s_version:
          - "v1.32.11"
          - "v1.33.12"
          - "v1.34.8"
          - "v1.35.5"
          - "v1.36.1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Setup Task
        uses: arduino/setup-task@v2

      - name: Create kind cluster config
        run: |
          cat << 'CONFIG' > kind-config.yaml
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          featureGates:
            DynamicResourceAllocation: true
          CONFIG

      - name: Setup kind cluster
        uses: helm/kind-action@v1
        with:
          version: v0.24.0
          node_image: kindest/node:${{ matrix.k8s_version }}
          config: kind-config.yaml
          cluster_name: draforge-e2e

      - name: Verify cluster is running and feature gates are enabled
        run: |
          kubectl cluster-info
          kubectl get --raw /metrics | grep "kubernetes_feature_enabled{name=\"DynamicResourceAllocation\"}"

      - name: Build binaries
        run: task build

      - name: Deploy DRAForge resources
        run: |
          kubectl apply -f deploy/crds/simulateddevicepool-crd.yaml
          # Apply a test scenario just to ensure the CRD is working
          kubectl apply -f examples/scenarios/basic-gpu.yaml
          sleep 5

      - name: Run E2E tests
        env:
          DRAFORGE_E2E: '1'
        run: go test -tags=e2e ./tests/e2e/... -v

      - name: Collect cluster logs on failure
        if: failure()
        run: |
          mkdir -p logs
          kubectl get nodes -o wide > logs/nodes.txt
          kubectl get all --all-namespaces > logs/all-resources.txt
          kubectl describe pods --all-namespaces > logs/pod-descriptions.txt
          kubectl get events --all-namespaces --sort-by='.metadata.creationTimestamp' > logs/events.txt
          kubectl logs -n kube-system -l component=kube-apiserver > logs/kube-apiserver.log
          kubectl logs -n kube-system -l component=kube-controller-manager > logs/kube-controller-manager.log
          kubectl logs -n kube-system -l component=kube-scheduler > logs/kube-scheduler.log

      - name: Upload logs artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-${{ matrix.k8s_version }}
          path: logs/
          retention-days: 5
