name: E2E Matrix Tests

on:
  workflow_dispatch:

jobs:
  local-e2e:
    name: Local E2E Matrix (kind)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        k8s_version: [v1.32.11, v1.33.12, v1.34.8, v1.35.5, v1.36.1]
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Setup Task
        uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0

      - name: Create kind cluster config
        run: |
          cat <<'CONFIG' > kind-config.yaml
          kind: Cluster
          apiVersion: kind.x-k8s.io/v1alpha4
          featureGates:
            DynamicResourceAllocation: true
          CONFIG

      - name: Setup kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.24.0
          node_image: kindest/node:${{ matrix.k8s_version }}
          config: kind-config.yaml
          cluster_name: draforge-e2e

      - name: Verify cluster is running
        run: |
          kubectl cluster-info
          kubectl api-resources | grep -E 'resourceclaims|resourceslices|deviceclasses'

      - name: Build binaries
        run: task build

      - name: Deploy DRAForge resources
        run: |
          kubectl apply -f deploy/crds/simulateddevicepool-crd.yaml
          kubectl apply -f examples/scenarios/basic-gpu.yaml
          kubectl get simulateddevicepools.draforge.oaslananka -A

      - name: Run E2E tests
        env:
          DRAFORGE_E2E: '1'
        run: go test -tags=e2e ./tests/e2e/... -v

      - name: Collect cluster logs on failure
        if: failure()
        run: |
          mkdir -p logs
          kubectl get nodes -o wide > logs/nodes.txt || true
          kubectl get all --all-namespaces > logs/all-resources.txt || true
          kubectl describe pods --all-namespaces > logs/pod-descriptions.txt || true
          kubectl get events --all-namespaces --sort-by='.metadata.creationTimestamp' > logs/events.txt || true

      - name: Upload logs artifact
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-logs-${{ matrix.k8s_version }}
          path: logs/
          retention-days: 5
