name: Optional DOKS E2E

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "run-e2e-doks" to confirm this will run workloads on a billable DOKS cluster'
        required: true
        type: string
        default: ''
      cluster_name:
        description: 'Existing DOKS cluster name to use for remote E2E tests'
        required: true
        type: string
        default: 'draforge-cluster'
      commit_sha:
        description: 'Optional commit SHA to test; leave empty to use the checked-out commit'
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: e2e-doks-${{ github.ref }}
  cancel-in-progress: false

# Requirements
# ------------
# This optional provider adapter is manual-only and runs workloads on an existing billable
# DigitalOcean Kubernetes cluster. It is not the provider-neutral release gate.
# DIGITALOCEAN_TOKEN should use only the kubernetes:read and
# kubernetes:access_cluster custom scopes required to locate the cluster and save kubeconfig.
#
# Safety gates:
# - manual workflow_dispatch only
# - exact confirmation phrase: run-e2e-doks
# - upstream owner guard
# - read-only GITHUB_TOKEN permissions
# - serialized runs per ref
# - timeout to avoid stuck jobs
# - best-effort cleanup after attempted runs
#
# Normal CI (ci.yml) does NOT require cloud credentials; this E2E is optional.
# See docs/demo.md for the DOKS showcase deployment runbook.

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
  DOKS_CLUSTER_NAME: ${{ inputs.cluster_name }}

jobs:
  run-e2e:
    name: Run Optional DOKS Smoke Tests
    if: ${{ github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: e2e-doks
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate manual inputs and required secret
        env:
          CONFIRM: ${{ inputs.confirm }}
          CLUSTER_NAME: ${{ inputs.cluster_name }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          DIGITALOCEAN_TOKEN: ${{ secrets.DIGITALOCEAN_TOKEN }}
        run: |
          set -euo pipefail

          if [[ "$CONFIRM" != "run-e2e-doks" ]]; then
            echo "ERROR: Type 'run-e2e-doks' in the confirm input to run this billable E2E workflow." >&2
            exit 1
          fi

          if [[ -z "$DIGITALOCEAN_TOKEN" ]]; then
            echo "ERROR: DIGITALOCEAN_TOKEN secret is not configured." >&2
            exit 1
          fi

          if [[ ! "$CLUSTER_NAME" =~ ^[A-Za-z0-9._-]{1,63}$ ]]; then
            echo "ERROR: cluster_name must be 1-63 chars and contain only letters, numbers, dot, underscore or dash." >&2
            exit 1
          fi

          if [[ -n "$COMMIT_SHA" && ! "$COMMIT_SHA" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "ERROR: commit_sha must be a 7-40 character hexadecimal Git SHA." >&2
            exit 1
          fi

      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - name: Save DigitalOcean Kubeconfig
        run: doctl kubernetes cluster kubeconfig save "$DOKS_CLUSTER_NAME" --expiry-seconds 3600

      - name: Run E2E Script
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          REMOTE_E2E_RUN_ID: ${{ github.run_id }}
          REMOTE_E2E_ARTIFACT_DIR: artifacts/remote-e2e
        run: |
          set -euo pipefail
          if [[ -n "$COMMIT_SHA" ]]; then
            bash scripts/remote-e2e.sh "$COMMIT_SHA"
          else
            bash scripts/remote-e2e.sh
          fi

      - name: Upload remote E2E logs and test results
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: remote-e2e-${{ github.run_id }}
          path: artifacts/remote-e2e/
          if-no-files-found: warn
          retention-days: 7

  cleanup:
    name: Cleanup Optional DOKS Resources
    if: ${{ always() && needs.run-e2e.result != 'skipped' && (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops') }}
    needs: [run-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: always()

      - name: Install doctl
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f # v2.5.2
        if: always()
        continue-on-error: true
        with:
          token: ${{ secrets.DIGITALOCEAN_TOKEN }}

      - name: Save DigitalOcean kubeconfig for cleanup
        if: always()
        continue-on-error: true
        run: doctl kubernetes cluster kubeconfig save "$DOKS_CLUSTER_NAME" --expiry-seconds 3600

      - name: Remove run-scoped E2E resources
        if: always()
        continue-on-error: true
        env:
          RUN_LABEL: ${{ github.run_id }}
        run: |
          kubectl delete job,serviceaccount -n draforge-ci \
            -l "draforge.oaslananka/e2e-run-id=$RUN_LABEL" \
            --ignore-not-found=true --wait=false
          kubectl delete clusterrole,clusterrolebinding \
            -l "draforge.oaslananka/e2e-run-id=$RUN_LABEL" \
            --ignore-not-found=true --wait=false

      - name: Tear down Helm release and sample resources
        if: always()
        continue-on-error: true
        run: |
          helm uninstall draforge -n draforge-system --ignore-not-found=true
          kubectl delete -f examples/scenarios/basic-gpu.yaml --ignore-not-found=true

      - name: Notify completion
        if: always()
        run: |
          echo "E2E run completed (state: ${{ job.status }}). DOKS resources cleaned up."
