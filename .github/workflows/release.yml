name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-rc.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing annotated release tag
        required: true
        type: string
      operation:
        description: Recover publication or verify existing artifacts
        required: true
        type: choice
        default: recover
        options:
          - recover
          - verify

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: release-${{ inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate release tag provenance
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validate recovery invocation source
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$WORKFLOW_REF" == "refs/heads/main" ]] || {
            echo "ERROR: release recovery must be dispatched from main" >&2
            exit 1
          }

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Fetch protected release refs
        run: |
          git fetch --force --no-tags origin refs/heads/main:refs/remotes/origin/main
          git fetch --force --tags origin

      - name: Verify annotated tag and main ancestry
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_MAIN_REF: origin/main
        run: bash scripts/verify-release-tag.sh

  install-e2e:
    needs: validate-tag
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.operation == 'recover' }}
    name: Full install E2E gate
    uses: ./.github/workflows/e2e-matrix.yml
    with:
      profile: full
      ref: ${{ inputs.release_tag || github.ref }}
    permissions:
      contents: read

  goreleaser:
    needs: install-e2e
    name: Run GoReleaser & Signing
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.operation == 'recover') && (github.repository_owner == 'oaslananka' || github.repository_owner == 'oaslananka-ops') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.3

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.5.2

      - name: Build Web SPA
        run: |
          pnpm --dir web install --frozen-lockfile --ignore-scripts
          pnpm --dir web build

      - name: Setup Syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify chart metadata and image references
        env:
          RELEASE_VERSION: ${{ inputs.release_tag || github.ref_name }}
        run: scripts/verify-chart-images.sh "${RELEASE_VERSION#v}"

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.16.0
          install-only: true

      - name: Verify GoReleaser Docker v2 contract
        run: python3 scripts/verify-goreleaser-docker-v2.py --self-test --check

      - name: Run GoReleaser
        run: goreleaser release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COSIGN_EXPERIMENTAL: "true"
          COSIGN_YES: "true"

      - name: Verify Docker v2 release artifacts
        run: python3 scripts/verify-goreleaser-docker-artifacts.py --self-test --validate

      - name: Log out of GHCR after publication
        run: docker logout ghcr.io

  verify-published:
    needs: [validate-tag, goreleaser]
    name: Verify published release
    if: ${{ always() && needs.validate-tag.result == 'success' && (needs.goreleaser.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'verify')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout verification tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout immutable release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          path: release-source
          fetch-depth: 0

      - name: Setup Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.17.3

      - name: Install Cosign
        uses: sigstore/cosign-installer@ba7bc0a3fef59531c69a25acd34668d6d3fe6f22 # v4.1.0

      - name: Verify release assets, signatures, and public images
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          RELEASE_SOURCE_DIR: ${{ github.workspace }}/release-source
        run: scripts/verify-published-release.sh "$RELEASE_TAG"
