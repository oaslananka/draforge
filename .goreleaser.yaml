# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: draforge
    binary: draforge
    main: ./cmd/draforge
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.versionVal={{.Version}} -X main.commitSHA={{.ShortCommit}}
  - id: draforge-controller
    binary: draforge-controller
    main: ./cmd/draforge-controller
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.versionVal={{.Version}} -X main.commitSHA={{.ShortCommit}}
  - id: draforge-sim-driver
    binary: draforge-sim-driver
    main: ./cmd/draforge-sim-driver
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.versionVal={{.Version}} -X main.commitSHA={{.ShortCommit}}

archives:
  - id: draforge
    ids:
      - draforge
    formats: [tar.gz]
    name_template: "draforge_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
  - id: draforge-controller
    ids:
      - draforge-controller
    formats: [tar.gz]
    name_template: "draforge-controller_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
  - id: draforge-sim-driver
    ids:
      - draforge-sim-driver
    formats: [tar.gz]
    name_template: "draforge-sim-driver_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: 'checksums.txt'

sboms:
  - artifacts: archive
    cmd: syft
    args: ["$artifact", "--output", "cyclonedx-json", "--file", "$document"]

signs:
  - id: checksums
    signature: "${artifact}.sig"
    cmd: cosign
    args:
      - "sign-blob"
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

dockers_v2:
  - id: draforge-server-image
    ids:
      - draforge
    images:
      - "ghcr.io/oaslananka/draforge-server"
    tags:
      - "{{ .Version }}"
      - "v{{ .Major }}.{{ .Minor }}"
      - "latest"
    dockerfile: build/package/Dockerfile.server.goreleaser
    extra_files:
      - web/dist
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.title": "{{.ProjectName}} server"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Version}}"
    sbom: true

  - id: draforge-controller-image
    ids:
      - draforge-controller
    images:
      - "ghcr.io/oaslananka/draforge-controller"
    tags:
      - "{{ .Version }}"
      - "v{{ .Major }}.{{ .Minor }}"
      - "latest"
    dockerfile: build/package/Dockerfile.controller.goreleaser
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.title": "{{.ProjectName}} controller"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Version}}"
    sbom: true

  - id: draforge-sim-driver-image
    ids:
      - draforge-sim-driver
    images:
      - "ghcr.io/oaslananka/draforge-sim-driver"
    tags:
      - "{{ .Version }}"
      - "v{{ .Major }}.{{ .Minor }}"
      - "latest"
    dockerfile: build/package/Dockerfile.sim-driver.goreleaser
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      "org.opencontainers.image.created": "{{.Date}}"
      "org.opencontainers.image.title": "{{.ProjectName}} simulator driver"
      "org.opencontainers.image.revision": "{{.FullCommit}}"
      "org.opencontainers.image.version": "{{.Version}}"
    sbom: true

docker_signs:
  - artifacts: all
    cmd: cosign
    args:
      - "sign"
      - "--yes"
      - "${artifact}"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
