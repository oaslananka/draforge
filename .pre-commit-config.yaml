repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json

  - repo: https://github.com/golangci/golangci-lint
    rev: v1.59.1
    hooks:
      - id: golangci-lint

  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.16.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ['@commitlint/config-conventional']

  - repo: local
    hooks:
      - id: zero-attribution-scan
        name: Zero Attribution Scan
        entry: grep -rniE "claude|anthropic|copilot|openai|chatgpt|gemini|jules|generated by|co-authored" . --include='*.go' --include='*.md' --include='*.ts' --include='*.tsx' --include='*.yaml' --include='*.yml' --include='*.tf' --include='*.sh' --include='Dockerfile*' --include='*.json'
        language: system
        stages: [commit]
        pass_filenames: false
