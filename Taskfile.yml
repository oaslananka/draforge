version: '3'

vars:
  # Binary paths — resolve from PATH by default, override via environment variable
  GO_BIN: '{{default "go" .GO_BIN}}'
  GOFMT_BIN: '{{default "gofmt" .GOFMT_BIN}}'
  GORELEASER_BIN: '{{default "goreleaser" .GORELEASER_BIN}}'

  # Platform-agnostic shell — Task's shell field handles this natively; keep a
  # portable fallback for any task that explicitly needs bash syntax.
  BASH_BIN: '{{default "bash" .BASH_BIN}}'

tasks:
  build:
    desc: Build all binaries
    cmds:
      - '{{.GO_BIN}} build -o bin/draforge ./cmd/draforge'
      - '{{.GO_BIN}} build -o bin/draforge-controller ./cmd/draforge-controller'
      - '{{.GO_BIN}} build -o bin/draforge-sim-driver ./cmd/draforge-sim-driver'

  build:windows:
    desc: Build all binaries for Windows (.exe)
    cmds:
      - '{{.GO_BIN}} build -o bin/draforge.exe ./cmd/draforge'
      - '{{.GO_BIN}} build -o bin/draforge-controller.exe ./cmd/draforge-controller'
      - '{{.GO_BIN}} build -o bin/draforge-sim-driver.exe ./cmd/draforge-sim-driver'

  fmt:
    desc: Format all Go code
    cmds:
      - '{{.GOFMT_BIN}} -w internal cmd pkg tests'

  fmt:terraform:
    desc: Format Terraform code
    cmds:
      - cd infra/terraform/environments/showcase && terraform fmt

  lint:
    desc: Lint Go code
    cmds:
      - golangci-lint run ./...

  vet:
    desc: Run go vet
    cmds:
      - '{{.GO_BIN}} vet ./...'

  vuln:
    desc: Run govulncheck
    cmds:
      - '{{.GO_BIN}} tool govulncheck ./...'

  test:unit:
    desc: Run Go unit tests (fast, no race)
    cmds:
      - '{{.GO_BIN}} test ./...'

  test:race:
    desc: Run Go unit tests with race detector and coverage
    cmds:
      - '{{.GO_BIN}} test -race "-coverprofile=coverage.out" ./...'

  test:
    desc: Run unit tests followed by race+coverage (default CI flow)
    cmds:
      - task: test:unit
      - task: test:race

  web:install:
    desc: Install web dependencies using pnpm
    cmds:
      - cd web && pnpm install --frozen-lockfile

  web:audit:
    desc: Audit frontend dependencies for high-severity advisories
    cmds:
      - cd web && pnpm audit --audit-level high

  web:test:
    desc: Run frontend unit and integration tests
    cmds:
      - cd web && pnpm test

  web:lint:
    desc: Lint web app
    cmds:
      - cd web && pnpm lint

  web:test:browser:install:
    desc: Install the exact Playwright Chromium, Firefox, and WebKit revisions
    cmds:
      - cd web && pnpm test:browser:install

  web:test:browser:
    desc: Run dashboard accessibility and compatibility tests in real browsers
    cmds:
      - cd web && pnpm test:browser

  web:build:
    desc: Build web app
    cmds:
      - cd web && pnpm build

  security:verify-actions:
    desc: Verify GitHub Actions are pinned to full commit SHAs
    cmds:
      - scripts/verify-github-action-pins.sh

  security:verify-kubernetes-modules:
    desc: Verify staged DRA and Kubernetes modules use one exact version
    cmds:
      - scripts/verify-kubernetes-module-alignment.sh

  security:verify-workloads:
    desc: Verify workload token and ephemeral-storage security contracts
    cmds:
      - scripts/verify-workload-security.sh

  security:verify-frontend-dependencies:
    desc: Verify frontend peer, local adapter, and Docker install policy
    cmds:
      - scripts/verify-frontend-dependency-policy.sh

  docs:verify:
    desc: Verify documentation links, commands, paths, versions, and workflow claims
    cmds:
      - python3 scripts/verify-documentation.py --self-test

  helm:lint:
    desc: Lint Helm charts
    cmds:
      - helm lint deploy/helm/draforge

  helm:verify-images:
    desc: Verify public, digest-pinned, and DOKS showcase image references
    cmds:
      - scripts/verify-chart-images.sh
      - scripts/test-chart-image-verifier.sh

  helm:verify-metrics:
    desc: Verify restricted controller metrics scraping and ServiceMonitor rendering
    cmds:
      - scripts/verify-controller-metrics-policy.sh

  helm:verify-lifecycle:
    desc: Verify readiness and graceful shutdown lifecycle settings
    cmds:
      - scripts/verify-runtime-lifecycle.sh

  helm:verify-exposure:
    desc: Verify disabled, local-demo, and secure public dashboard exposure
    cmds:
      - scripts/verify-dashboard-exposure.sh

  helm:verify-sim-driver:
    desc: Verify demo and fail-closed node CDI output modes
    cmds:
      - scripts/verify-sim-driver-cdi.sh

  e2e:install-contract:
    desc: Test install-level E2E orchestration without creating a cluster
    cmds:
      - '{{.BASH_BIN}} scripts/verify-install-e2e-policy.sh'
      - '{{.BASH_BIN}} scripts/test-install-e2e-cni.sh'
      - '{{.BASH_BIN}} scripts/test-install-e2e-harness.sh'
      - '{{.BASH_BIN}} scripts/test-controller-ha-e2e-harness.sh'

  e2e:install-kind:
    desc: Build, install, and verify the complete stack on the pull-request kind baseline
    cmds:
      - '{{.BASH_BIN}} scripts/kind-install-e2e.sh pull-request'

  e2e:install-kind-full:
    desc: Run the complete install E2E against each full compatibility target
    cmds:
      - '{{.BASH_BIN}} scripts/kind-install-e2e-matrix.sh full'

  infra:preflight:
    desc: Validate Terraform showcase tools and static configuration
    cmds:
      - '{{.BASH_BIN}} scripts/validate-terraform-showcase.sh'

  infra:init:
    desc: Initialize Terraform
    cmds:
      - cd infra/terraform/environments/showcase && terraform init

  infra:plan:
    desc: Generate Terraform plan and run showcase policy validation
    cmds:
      - '{{.BASH_BIN}} scripts/validate-terraform-showcase.sh --plan'

  infra:validate:
    desc: Validate Terraform plan via validation policy
    cmds:
      - python scripts/validate-plan.py infra/terraform/environments/showcase/tfplan.json

  infra:apply:
    desc: Apply Terraform changes
    cmds:
      - '{{.BASH_BIN}} scripts/audit-cloud-resources.sh'
      - cd infra/terraform/environments/showcase && terraform apply tfplan
      - '{{.BASH_BIN}} scripts/audit-cloud-resources.sh'

  infra:audit:
    desc: Audit resources for the optional DigitalOcean showcase
    cmds:
      - '{{.BASH_BIN}} scripts/audit-cloud-resources.sh'

  infra:cost:
    desc: Estimate cost for the optional DigitalOcean showcase
    cmds:
      - '{{.BASH_BIN}} scripts/cost-report.sh'

  sbom:
    desc: Generate CycloneDX SBOM
    cmds:
      - syft dir:. -o cyclonedx-json > draforge.sbom.json

  release:local:
    desc: Run GoReleaser dry-run release locally
    cmds:
      - '{{.GORELEASER_BIN}} release --snapshot --clean --skip=docker,sbom,sign'

  release:verify:
    desc: Verify release artifacts (checksums, provenance, binaries, charts)
    cmds:
      - '{{.BASH_BIN}} scripts/verify-release.sh'

  demo:up:
    desc: Deploy the optional live showcase demo to DOKS
    cmds:
      - '{{.BASH_BIN}} scripts/audit-cloud-resources.sh'
      - cd infra/terraform/environments/showcase && terraform plan -out=tfplan
      - cd infra/terraform/environments/showcase && terraform show -json tfplan > tfplan.json
      - python scripts/validate-plan.py infra/terraform/environments/showcase/tfplan.json
      - cd infra/terraform/environments/showcase && terraform apply tfplan
      - '{{.BASH_BIN}} scripts/remote-build.sh server'
      - '{{.BASH_BIN}} scripts/remote-build.sh controller'
      - '{{.BASH_BIN}} scripts/remote-build.sh sim-driver'
      - helm upgrade --install draforge deploy/helm/draforge -n draforge-system --create-namespace -f deploy/helm/draforge/values-showcase-docr.yaml
      - kubectl apply -f examples/scenarios/basic-gpu.yaml

  demo:down:
    desc: Tear down the live showcase demo and all billable cloud infrastructure
    cmds:
      - helm uninstall draforge -n draforge-system --ignore-not-found=true
      - kubectl delete -f examples/scenarios/basic-gpu.yaml --ignore-not-found=true
      - cd infra/terraform/environments/showcase && terraform destroy -auto-approve
      - '{{.BASH_BIN}} scripts/audit-cloud-resources.sh'
