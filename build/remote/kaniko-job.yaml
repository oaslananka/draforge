apiVersion: batch/v1
kind: Job
metadata:
  name: draforge-build-COMPONENT_NAME-RUN_ID
  namespace: draforge-ci
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      initContainers:
      - name: clone
        image: alpine/git:2.45.2
        command:
        - sh
        - -c
        - |
          git clone REPO_URL /workspace && \
          cd /workspace && \
          git checkout COMMIT_SHA
        volumeMounts:
        - name: workspace
          mountPath: /workspace
      containers:
      - name: kaniko
        image: gcr.io/kaniko-project/executor:v1.23.1
        args:
        - --context=dir:///workspace
        - --dockerfile=/workspace/build/package/Dockerfile.COMPONENT_NAME
        - --destination=REGISTRY_URL/IMAGE_NAME:TAG
        - --cache=true
        - --cache-dir=/cache
        resources:
          requests:
            cpu: "500m"
            memory: "1Gi"
          limits:
            cpu: "1.5"
            memory: "2Gi"
        volumeMounts:
        - name: workspace
          mountPath: /workspace
        - name: registry-creds
          mountPath: /kaniko/.docker
        - name: cache
          mountPath: /cache
      volumes:
      - name: workspace
        emptyDir: {}
      - name: registry-creds
        secret:
          secretName: registry-draforge
          items:
          - key: .dockerconfigjson
            path: config.json
      - name: cache
        emptyDir: {}
