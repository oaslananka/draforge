coverage:
  status:
    project:
      go:
        informational: true
        flags:
          - go
    patch:
      go:
        informational: true
        flags:
          - go

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: "any_change"

flags:
  go:
    carryforward: false


# Go's coverprofile uses module-qualified paths while the repository tree is
# relative. Apply an explicit stable prefix mapping for isolated upload jobs.
fixes:
  - "github.com/oaslananka/draforge/::"
