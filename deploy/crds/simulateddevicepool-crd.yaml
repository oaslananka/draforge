apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: simulateddevicepools.draforge.oaslananka
spec:
  group: draforge.oaslananka
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Driver
          type: string
          jsonPath: .spec.driverName
        - name: Devices
          type: integer
          jsonPath: .spec.deviceCount
        - name: Type
          type: string
          jsonPath: .spec.deviceType
        - name: Health
          type: string
          jsonPath: .spec.health
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - driverName
                - deviceCount
                - deviceType
              properties:
                driverName:
                  type: string
                poolName:
                  type: string
                deviceCount:
                  type: integer
                  minimum: 1
                deviceType:
                  type: string
                targetNodes:
                  type: array
                  items:
                    type: string
                health:
                  type: string
                  default: "healthy"
                  enum:
                    - healthy
                    - unhealthy
                    - capacity-exhausted
                    - disappear
                attributes:
                  type: object
                  additionalProperties:
                    type: string
                capacities:
                  type: object
                  additionalProperties:
                    type: string
            status:
              type: object
              properties:
                publishedSlices:
                  type: array
                  items:
                    type: string
                activeFaults:
                  type: array
                  items:
                    type: string
  scope: Namespaced
  names:
    plural: simulateddevicepools
    singular: simulateddevicepool
    kind: SimulatedDevicePool
    shortNames:
      - simpool
      - sdp
