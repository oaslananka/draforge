{{- if not (has .Values.nodePlugin.outputMode (list "demo" "node")) }}
{{- fail "nodePlugin.outputMode must be either 'demo' or 'node'" }}
{{- end }}
{{- $demoMode := eq .Values.nodePlugin.outputMode "demo" -}}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ include "draforge.fullname" . }}-node-plugin
  labels:
    {{- include "draforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: node-plugin
spec:
  selector:
    matchLabels:
      {{- include "draforge.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: node-plugin
  template:
    metadata:
      labels:
        {{- include "draforge.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: node-plugin
    spec:
      serviceAccountName: {{ include "draforge.fullname" . }}-node-plugin
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: {{ ternary 1000 0 $demoMode }}
        runAsNonRoot: {{ $demoMode }}
        runAsUser: {{ ternary 1000 0 $demoMode }}
      containers:
        - name: node-plugin
          image: {{ include "draforge.image" (dict "registry" .Values.global.imageRegistry "repository" .Values.nodePlugin.image.repository "tag" .Values.nodePlugin.image.tag "digest" .Values.nodePlugin.image.digest "appVersion" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.nodePlugin.image.pullPolicy }}
          args:
            - --output-mode={{ .Values.nodePlugin.outputMode }}
            - --cdi-dir=/var/lib/kubelet/device-plugins/cdi
            - --health-addr=:{{ .Values.nodePlugin.health.port }}
            - --refresh-interval={{ .Values.nodePlugin.refreshInterval }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          ports:
            - name: health
              containerPort: {{ .Values.nodePlugin.health.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.nodePlugin.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: {{ $demoMode }}
            runAsUser: {{ ternary 1000 0 $demoMode }}
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: cdi-dir
              mountPath: /var/lib/kubelet/device-plugins/cdi
      volumes:
        - name: cdi-dir
          {{- if $demoMode }}
          emptyDir:
            sizeLimit: 16Mi
          {{- else }}
          hostPath:
            path: /var/lib/kubelet/device-plugins/cdi
            type: DirectoryOrCreate
          {{- end }}
