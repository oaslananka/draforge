apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "draforge.fullname" . }}-controller
  labels:
    {{- include "draforge.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicaCount }}
  selector:
    matchLabels:
      {{- include "draforge.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller
  template:
    metadata:
      labels:
        {{- include "draforge.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: {{ include "draforge.fullname" . }}-controller
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: controller
          image: {{ include "draforge.image" (dict "registry" .Values.global.imageRegistry "repository" .Values.controller.image.repository "tag" .Values.controller.image.tag "digest" .Values.controller.image.digest "appVersion" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          args:
            - --readiness-timeout={{ .Values.controller.lifecycle.readinessTimeout }}
            - --readiness-grace-period={{ .Values.controller.lifecycle.readinessGracePeriod }}
            - --shutdown-timeout={{ .Values.controller.lifecycle.shutdownTimeout }}
            - --leader-elect={{ .Values.controller.leaderElection.enabled }}
            - --leader-election-lease-name={{ include "draforge.fullname" . }}-controller
            - --leader-election-lease-duration={{ .Values.controller.leaderElection.leaseDuration }}
            - --leader-election-renew-deadline={{ .Values.controller.leaderElection.renewDeadline }}
            - --leader-election-retry-period={{ .Values.controller.leaderElection.retryPeriod }}
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: runtime
              containerPort: {{ .Values.controller.metrics.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: runtime
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: runtime
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
