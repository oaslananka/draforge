{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "draforge.fullname" . }}
  labels:
    {{- include "draforge.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "draforge.fullname" . }}-server
  labels:
    {{- include "draforge.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "draforge.fullname" . }}
  rules:
    - backendRefs:
        - name: {{ include "draforge.fullname" . }}-server
          port: {{ .Values.server.service.port }}
{{- else if .Values.gateway.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "draforge.fullname" . }}
  labels:
    {{- include "draforge.labels" . | nindent 4 }}
  {{- with .Values.gateway.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.gateway.ingress.className }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "draforge.fullname" . }}-server
                port:
                  number: {{ .Values.server.service.port }}
{{- end }}
