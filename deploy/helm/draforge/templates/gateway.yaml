{{- $externalEnabled := or .Values.gateway.enabled .Values.gateway.ingress.enabled -}}
{{- $secure := and $externalEnabled (not .Values.gateway.allowInsecureHTTP) -}}
{{- $serverServiceName := printf "%s-server" (include "draforge.fullname" .) -}}
{{- $backendName := $serverServiceName -}}
{{- $backendPort := .Values.server.service.port -}}
{{- if $secure -}}
{{- if eq .Values.gateway.authentication.proxyService.name $serverServiceName -}}
{{- fail "secure external exposure must route through a separate authentication proxy Service" -}}
{{- end -}}
{{- $backendName = .Values.gateway.authentication.proxyService.name -}}
{{- $backendPort = .Values.gateway.authentication.proxyService.port -}}
{{- end -}}
{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ include "draforge.fullname" . }}
  labels:
    {{- include "draforge.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: {{ ternary "https" "http" $secure }}
      protocol: {{ ternary "HTTPS" "HTTP" $secure }}
      port: {{ ternary 443 80 $secure }}
      {{- with .Values.gateway.hostname }}
      hostname: {{ . | quote }}
      {{- end }}
      {{- if $secure }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Values.gateway.tls.secretName }}
      {{- end }}
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "draforge.fullname" . }}-server
  labels:
    {{- include "draforge.labels" . | nindent 4 }}
spec:
  parentRefs:
    - name: {{ include "draforge.fullname" . }}
  {{- with .Values.gateway.hostname }}
  hostnames:
    - {{ . | quote }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ $backendName }}
          port: {{ $backendPort }}
{{- else if .Values.gateway.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "draforge.fullname" . }}
  labels:
    {{- include "draforge.labels" . | nindent 4 }}
  {{- with .Values.gateway.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.gateway.ingress.className }}
  {{- if $secure }}
  tls:
    - hosts:
        - {{ .Values.gateway.hostname | quote }}
      secretName: {{ .Values.gateway.tls.secretName }}
  {{- end }}
  rules:
    - {{- with .Values.gateway.hostname }}
      host: {{ . | quote }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $backendName }}
                port:
                  number: {{ $backendPort }}
{{- end }}
