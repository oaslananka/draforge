{{- if .Values.networkPolicies.enabled }}
# Network Policies for DRAForge Namespace
# SPDX-License-Identifier: Apache-2.0
{{- $fullName := include "draforge.fullname" . }}
{{- $name := include "draforge.name" . }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}-server-policy
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/component: server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Server accepts HTTP traffic on its service port. Deployments can narrow
    # source access further at the Gateway/Ingress layer.
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    {{- include "draforge.restrictedEgress" . | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullName }}-controller-policy
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/component: controller
  policyTypes:
    - Ingress
    - Egress
  {{- if and .Values.controller.metrics.service.enabled .Values.controller.metrics.networkPolicy.enabled }}
  ingress:
    - from:
        - namespaceSelector:
            {{- toYaml .Values.controller.metrics.networkPolicy.namespaceSelector | nindent 12 }}
          {{- with .Values.controller.metrics.networkPolicy.podSelector }}
          podSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.controller.metrics.port }}
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    {{- include "draforge.restrictedEgress" . | nindent 4 }}
{{- end }}
