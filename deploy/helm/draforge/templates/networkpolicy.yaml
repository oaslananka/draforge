{{- if .Values.networkPolicies.enabled }}
# Network Policies for DRAForge Namespace
# SPDX-License-Identifier: Apache-2.0
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "draforge.fullname" . }}-server-policy
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "draforge.name" . }}
      app.kubernetes.io/component: server
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow inbound on port 8080 from any pod (usually gateway or ingress controller)
    - ports:
        - protocol: TCP
          port: 8080
  egress:
    - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "draforge.fullname" . }}-controller-policy
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ include "draforge.name" . }}
      app.kubernetes.io/component: controller
  policyTypes:
    - Ingress
    - Egress
  ingress: [] # No incoming connections allowed to controller
  egress:
    - {}
{{- end }}
