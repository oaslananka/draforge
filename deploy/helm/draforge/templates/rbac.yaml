# Scoped RBAC Permissions for DRAForge
# SPDX-License-Identifier: Apache-2.0

# 1. Server ClusterRole (Read-Only)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "draforge.fullname" . }}-server-role
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims", "resourceslices", "deviceclasses", "resourceclaimtemplates"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["draforge.oaslananka"]
    resources: ["simulateddevicepools"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "draforge.fullname" . }}-server-binding
subjects:
  - kind: ServiceAccount
    name: {{ include "draforge.fullname" . }}-server
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "draforge.fullname" . }}-server-role
  apiGroup: rbac.authorization.k8s.io

---
# 2. Controller ClusterRole (Read/Write for Simulation)
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "draforge.fullname" . }}-controller-role
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims/binding"]
    verbs: ["update"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceslices"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["deviceclasses", "resourceclaimtemplates"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["draforge.oaslananka"]
    resources: ["simulateddevicepools"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["draforge.oaslananka"]
    resources: ["simulateddevicepools/status"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "draforge.fullname" . }}-controller-binding
subjects:
  - kind: ServiceAccount
    name: {{ include "draforge.fullname" . }}-controller
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "draforge.fullname" . }}-controller-role
  apiGroup: rbac.authorization.k8s.io

{{- if .Values.controller.leaderElection.enabled }}
---
# Controller leader-election Role is namespaced and limited to Lease operations.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "draforge.fullname" . }}-controller-leader-election
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "draforge.fullname" . }}-controller-leader-election
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ include "draforge.fullname" . }}-controller
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ include "draforge.fullname" . }}-controller-leader-election
  apiGroup: rbac.authorization.k8s.io

{{- end }}

---
# 3. Node Plugin ClusterRole
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "draforge.fullname" . }}-node-plugin-role
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["resource.k8s.io"]
    resources: ["resourceclaims"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "draforge.fullname" . }}-node-plugin-binding
subjects:
  - kind: ServiceAccount
    name: {{ include "draforge.fullname" . }}-node-plugin
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ include "draforge.fullname" . }}-node-plugin-role
  apiGroup: rbac.authorization.k8s.io
