# DigitalOcean Container Registry overrides for the DOKS showcase build flow.
# This profile intentionally enables unauthenticated HTTP exposure for a short-lived demo.
global:
  imageRegistry: registry.digitalocean.com/draforge
  imagePullSecrets:
    - name: registry-draforge

server:
  image:
    repository: draforge
    tag: server-latest
    digest: ""
    pullPolicy: Always
  cors:
    allowedOrigins:
      - "*"

controller:
  image:
    repository: draforge
    tag: controller-latest
    digest: ""
    pullPolicy: Always

nodePlugin:
  image:
    repository: draforge
    tag: sim-driver-latest
    digest: ""
    pullPolicy: Always

gateway:
  enabled: true
  allowInsecureHTTP: true
