# deploy/helm/draforge/values.yaml

global:
  imageRegistry: registry.digitalocean.com/draforge
  imagePullSecrets: []

server:
  replicaCount: 1
  image:
    repository: draforge-server
    tag: "v0.1.0"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

controller:
  replicaCount: 1
  image:
    repository: draforge-controller
    tag: "v0.1.0"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

nodePlugin:
  image:
    repository: draforge-sim-driver
    tag: "v0.1.0"
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  securityContext:
    privileged: false
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

gateway:
  enabled: true
  className: gateway-api
  hostname: "" # Dynamically set or fallback
  ingress:
    enabled: false
    className: nginx
    annotations: {}

networkPolicies:
  enabled: true
