# deploy/helm/draforge/values.yaml

global:
  # Public releases are published to GHCR. Override this registry for private mirrors.
  imageRegistry: ghcr.io
  imagePullSecrets: []

server:
  replicaCount: 1
  image:
    repository: oaslananka/draforge-server
    # Empty tag defaults to Chart.appVersion. Set digest to pin an immutable image.
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  # Empty keeps the binary default. Externally exposed profiles must set this explicitly.
  cors:
    allowedOrigins: []
  lifecycle:
    readinessTimeout: 2s
    readinessGracePeriod: 15s
    shutdownTimeout: 5s
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

controller:
  replicaCount: 1
  image:
    repository: oaslananka/draforge-controller
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  lifecycle:
    readinessTimeout: 2s
    readinessGracePeriod: 15s
    shutdownTimeout: 5s
  metrics:
    port: 8082
    service:
      enabled: true
      type: ClusterIP
      port: 8082
    # Metrics ingress remains closed until an explicit monitoring peer is selected.
    networkPolicy:
      enabled: false
      namespaceSelector:
        matchLabels: {}
      # Empty means every pod in the selected namespace. Add matchLabels to narrow it.
      podSelector: {}
    # Requires the Prometheus Operator CRDs and remains disabled by default.
    serviceMonitor:
      enabled: false
      namespace: ""
      labels: {}
      interval: 30s
      scrapeTimeout: 10s
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

nodePlugin:
  outputMode: "demo" # Must be either "demo" or "node"
  image:
    repository: oaslananka/draforge-sim-driver
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  securityContext:
    privileged: false
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

gateway:
  # External exposure is disabled by default. Use one of the explicit profile files.
  enabled: false
  allowInsecureHTTP: false
  className: cilium
  hostname: ""
  annotations: {}
  tls:
    enabled: false
    secretName: ""
  # Secure public routes terminate at an operator-managed identity-aware proxy.
  authentication:
    proxyService:
      name: ""
      port: 4180
  ingress:
    enabled: false
    className: nginx
    annotations: {}

networkPolicies:
  enabled: true
  # Set to true only for local/demo clusters that do not support restricted egress policies.
  allowAllEgress: false
