# deploy/helm/draforge/values.yaml

global:
  # Public releases are published to GHCR. Override this registry for private mirrors.
  imageRegistry: ghcr.io
  imagePullSecrets: []

server:
  replicaCount: 1
  image:
    repository: oaslananka/draforge-server
    # Empty tag defaults to Chart.appVersion. Set digest to pin an immutable image.
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

controller:
  replicaCount: 1
  image:
    repository: oaslananka/draforge-controller
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  metrics:
    port: 8082
    service:
      enabled: true
      type: ClusterIP
      port: 8082
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

nodePlugin:
  outputMode: "demo" # Must be either "demo" or "node"
  image:
    repository: oaslananka/draforge-sim-driver
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 128Mi
  securityContext:
    privileged: false
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    seccompProfile:
      type: RuntimeDefault

gateway:
  enabled: true
  className: cilium
  hostname: "" # Dynamically set or fallback
  ingress:
    enabled: false
    className: nginx
    annotations: {}

networkPolicies:
  enabled: true
  # Set to true only for local/demo clusters that do not support restricted egress policies.
  allowAllEgress: false
