apiVersion: draforge.oaslananka/v1alpha1
kind: SimulatedDevicePool
metadata:
  name: multi-node-gpu
  namespace: default
spec:
  driverName: sim.draforge.oaslananka
  poolName: gpu-pool
  deviceCount: 2
  deviceType: gpu
  targetNodes:
    - node-0
    - node-1
  attributes:
    model: "NVIDIA-A100-Virtual"
    vendor: "NVIDIA"
  capacities:
    memory: "80Gi"
