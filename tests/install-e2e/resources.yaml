apiVersion: v1
kind: Namespace
metadata:
  name: draforge-e2e
  labels:
    app.kubernetes.io/part-of: draforge
    draforge.oaslananka/e2e: "true"
---
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: draforge-e2e-gpu
  labels:
    app.kubernetes.io/part-of: draforge
    draforge.oaslananka/e2e: "true"
spec: {}
---
apiVersion: draforge.oaslananka/v1alpha1
kind: SimulatedDevicePool
metadata:
  name: e2e-gpu-pool
  namespace: draforge-e2e
  labels:
    app.kubernetes.io/part-of: draforge
    draforge.oaslananka/e2e: "true"
spec:
  driverName: sim.draforge.oaslananka
  poolName: e2e-gpu-pool
  deviceCount: 2
  deviceType: gpu
  attributes:
    model: DRAForge-E2E-GPU
    vendor: DRAForge
  capacities:
    memory: 16Gi
---
apiVersion: resource.k8s.io/v1
kind: ResourceClaim
metadata:
  name: e2e-gpu-claim
  namespace: draforge-e2e
  labels:
    app.kubernetes.io/part-of: draforge
    draforge.oaslananka/e2e: "true"
spec:
  devices:
    requests:
      - name: gpu
        exactly:
          deviceClassName: draforge-e2e-gpu
          allocationMode: ExactCount
          count: 1
