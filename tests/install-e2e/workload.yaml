apiVersion: v1
kind: Pod
metadata:
  name: e2e-claim-consumer
  namespace: draforge-e2e
  labels:
    app.kubernetes.io/part-of: draforge
    draforge.oaslananka/e2e: "true"
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    seccompProfile:
      type: RuntimeDefault
  resourceClaims:
    - name: gpu
      resourceClaimName: e2e-gpu-claim
  containers:
    - name: consumer
      image: docker.io/draforge-e2e/server:local
      imagePullPolicy: Never
      command:
        - /bin/sh
        - -c
        - sleep 3600
      resources:
        claims:
          - name: gpu
        requests:
          cpu: 10m
          memory: 16Mi
          ephemeral-storage: 16Mi
        limits:
          cpu: 100m
          memory: 64Mi
          ephemeral-storage: 64Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
        seccompProfile:
          type: RuntimeDefault
